<style>
  :root{
    --bg1:#0a1f44; --bg2:#0f3460; --card:rgba(255,255,255,.07);
    --line:rgba(255,255,255,.14); --text:#f2f6fb; --muted:#b8c6dc; --accent:#2ecc71; --accent2:#27ae60;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;

    color:var(--text); min-height:100vh; display:flex; justify-content:center; padding:20px 16px 40px;
  }
  .wrap{width:100%;max-width:440px}
  .lang{display:flex;justify-content:center;gap:8px;margin-bottom:18px}
  .lang button{
    background:transparent;border:1px solid var(--line);color:var(--muted);
    padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;font-weight:600
  }
  .lang button.active{background:var(--accent);border-color:var(--accent);color:#06210f}
  .profile{text-align:center;margin-bottom:22px}
  .avatar{
    width:128px;height:128px;border-radius:50%;margin:0 auto 14px;
    border:3px solid var(--accent);overflow:hidden;background:var(--bg2);
    display:flex;align-items:center;justify-content:center;
    font-size:42px;font-weight:700;color:var(--accent)
  }
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  h1{font-size:26px;margin-bottom:6px}
  .role{color:var(--accent);font-weight:600;font-size:15px;margin-bottom:10px}
  .about{color:var(--muted);font-size:14px;line-height:1.5;padding:0 6px}
  .save{
    display:block;text-align:center;text-decoration:none;
    background:var(--accent);color:#06210f;font-weight:700;font-size:16px;
    padding:14px;border-radius:12px;margin:22px 0 18px;
    box-shadow:0 6px 18px rgba(46,204,113,.28)
  }
  .save:active{background:var(--accent2)}
  .list{display:flex;flex-direction:column;gap:10px}
  .item{
    display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--text);
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px
  }
  .item:active{background:rgba(255,255,255,.13)}
  .ico{
    width:38px;height:38px;border-radius:10px;background:rgba(46,204,113,.16);
    display:flex;align-items:center;justify-content:center;flex-shrink:0
  }
  .ico svg{width:20px;height:20px;fill:var(--accent)}
  .txt small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
  .txt span{font-size:15px;font-weight:600;word-break:break-all}
  .section{margin:24px 0 10px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .services{list-style:none;display:flex;flex-direction:column;gap:8px}
  .services li{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:11px 14px;font-size:14px;display:flex;gap:10px;align-items:center
  }
  .services li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}
</style>

function setLang(l){
  document.documentElement.lang = l;

  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("active", b.dataset.l===l));
  try{ localStorage.setItem("lang", l); }catch(e){}
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.l)));
